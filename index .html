<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yono All Games</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
      text-align: center;
    }

    .box {
      padding: 70px 20px;
    }

    h1 {
      font-size: 42px;
      color: #ff3333;
    }

    p {
      font-size: 18px;
      color: #ccc;
    }

    .btn {
      display: inline-block;
      margin-top: 25px;
      padding: 14px 30px;
      background: #e50914;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }

    .features {
      margin: 40px auto;
      max-width: 500px;
    }

    .card {
      background: #181818;
      padding: 20px;
      margin: 15px;
      border-radius: 12px;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>🎮 Yono All Games</h1>
    <p>एक शानदार गेमिंग अनुभव के लिए आपका स्वागत है।</p>

    <a class="btn" href="#">Game App</a>

    <div class="features">
      <div class="card">🎮 मज़ेदार Games</div>
      <div class="card">📱 Mobile Friendly</div>
      <div class="card">⚡ Fast & Simple</div>
    </div>
  </div>
</body>
</html>
